[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfake-detection-framework"
version = "1.0"
description = "Multi-modal deepfake detection framework (video + audio, with explainability)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchaudio",
    "transformers>=4.40",
    "mediapipe>=0.10",
    "opencv-python",
    "numpy",
    "soundfile",
    "matplotlib",
    "PyYAML",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
