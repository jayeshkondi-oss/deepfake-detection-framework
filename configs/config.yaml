project:
  name: "Multi-Modal Deepfake Detection Framework"
  version: "1.0"

data:
  image_size: 224
  sample_frames: 16
  audio_sample_rate: 16000

model:
  visual_encoder: "vit"
  visual_feature_dim: 768

  audio_encoder: "wav2vec2"

  fusion: "cross_attention"

  temporal_model: "transformer"

  num_classes: 2

training:
  batch_size: 4
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.0001

  early_stopping_patience: 5

  mixed_precision: true

output:
  checkpoint_dir: "models/checkpoints"
  result_dir: "outputs"